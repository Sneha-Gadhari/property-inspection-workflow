<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Inspection Workflow</title>
    <style>
        :root {
            --navy: #2F5597;
            --navy-dark: #1F3864;
            --ink: #1A1A1A;
            --muted: #6B7280;
            --border: #E2E5EA;
            --bg: #F7F8FA;
            --card: #FFFFFF;
            --green: #1B7F4D;
            --green-bg: #E8F5EC;
            --red: #B3261E;
            --red-bg: #FCEBEA;
            --amber: #92600D;
            --amber-bg: #FBF0DC;
            --gray-bg: #EEF0F3;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            padding: 0;
        }
        header {
            background: var(--navy-dark);
            color: white;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 17px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.2px;
        }
        header .who {
            font-size: 13px;
            color: #C9D6EA;
        }
        header button {
            background: transparent;
            color: white;
            border: 1px solid #4A6DA0;
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            width: auto;
            margin-left: 14px;
        }
        header button:hover { background: #3D5C8F; }

        main {
            max-width: 880px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        .auth-wrap {
            max-width: 420px;
            margin: 60px auto;
        }
        .auth-wrap h1 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 28px;
            color: var(--navy-dark);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin: 0 0 16px;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
            margin-top: 12px;
        }
        label:first-of-type { margin-top: 0; }

        input, select {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
            background: white;
            color: var(--ink);
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--navy);
        }

        button.primary {
            width: 100%;
            margin-top: 18px;
            padding: 10px;
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button.primary:hover { background: var(--navy-dark); }

        .tab-switch {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .tab-switch button {
            flex: 1;
            padding: 9px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: var(--muted);
            width: auto;
        }
        .tab-switch button.active {
            background: var(--navy);
            color: white;
            font-weight: 600;
        }

        .msg {
            font-size: 13px;
            margin-top: 12px;
            padding: 8px 10px;
            border-radius: 5px;
        }
        .msg.error { background: var(--red-bg); color: var(--red); }
        .msg.ok { background: var(--green-bg); color: var(--green); }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 10px;
            border-bottom: 2px solid var(--border);
        }
        td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.SUBMITTED { background: var(--gray-bg); color: var(--muted); }
        .badge.UNDER_REVIEW { background: var(--amber-bg); color: var(--amber); }
        .badge.APPROVED { background: var(--green-bg); color: var(--green); }
        .badge.REJECTED { background: var(--red-bg); color: var(--red); }

        .icon-btn {
            width: auto;
            display: inline-block;
            padding: 5px 9px;
            margin-right: 4px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 13px;
        }
        .icon-btn.approve:hover { background: var(--green-bg); border-color: var(--green); }
        .icon-btn.reject:hover { background: var(--red-bg); border-color: var(--red); }

        .empty {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 24px;
        }

        .hidden { display: none !important; }

        .stats-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-box {
            flex: 1;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            text-align: center;
        }
        .stat-box .num { font-size: 22px; font-weight: 700; color: var(--navy-dark); }
        .stat-box .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--muted);
        }
        .checkbox-row input { width: auto; margin: 0; }

        textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
            background: white;
            color: var(--ink);
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
        }
        textarea:focus { outline: none; border-color: var(--navy); }

        .remarks-note {
            font-size: 12px;
            color: var(--muted);
            font-style: italic;
            margin-top: 3px;
        }

        .role-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--gray-bg);
            color: var(--muted);
        }
        .role-tag.ADMIN { background: #EAE3F8; color: #5B3AA8; }
        .role-tag.REVIEWER { background: var(--amber-bg); color: var(--amber); }
        .role-tag.INSPECTOR { background: var(--green-bg); color: var(--green); }
        .role-tag.PROPERTY_OWNER { background: #DDEEF7; color: #1A6690; }
    </style>
</head>
<body>

<div id="authView" class="auth-wrap">
    <h1>Property Inspection Workflow</h1>
    <div class="card">
        <div class="tab-switch">
            <button id="loginTabBtn" class="active" onclick="showTab('login')">Log In</button>
            <button id="registerTabBtn" onclick="showTab('register')">Register</button>
        </div>

        <div id="loginTab">
            <label>Username</label>
            <input id="loginUsername" placeholder="e.g. demo">
            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="••••••••">
            <button class="primary" onclick="login()">Log In</button>
        </div>

        <div id="registerTab" class="hidden">
            <label>Username</label>
            <input id="regUsername" placeholder="Choose a username">
            <label>Password</label>
            <input id="regPassword" type="password" placeholder="Choose a password">
            <label>I am a...</label>
            <select id="regRole">
                <option value="INSPECTOR">Inspector</option>
                <option value="REVIEWER">Reviewer</option>
                <option value="PROPERTY_OWNER">Property Owner</option>
            </select>
            <button class="primary" onclick="register()">Register</button>
        </div>

        <div id="authMsg"></div>
    </div>
</div>

<div id="appView" class="hidden">
    <header>
        <h1>Property Inspection Workflow</h1>
        <div>
            <span class="who">Signed in as <strong id="whoami"></strong> &middot; <span id="roleLabel"></span></span>
            <button onclick="logout()">Log out</button>
        </div>
    </header>

    <main>
        <div id="statsRow" class="stats-row hidden">
            <div class="stat-box"><div class="num" id="statSubmitted">0</div><div class="lbl">Submitted</div></div>
            <div class="stat-box"><div class="num" id="statUnderReview">0</div><div class="lbl">Under Review</div></div>
            <div class="stat-box"><div class="num" id="statApproved">0</div><div class="lbl">Approved</div></div>
            <div class="stat-box"><div class="num" id="statRejected">0</div><div class="lbl">Rejected</div></div>
        </div>

        <div id="usersCard" class="card hidden">
            <h2>All Users</h2>
            <table id="usersTbl"></table>
        </div>

        <div id="pendingCard" class="card hidden">
            <h2>Pending User Approvals</h2>
            <table id="pendingTbl"></table>
        </div>

        <div id="submitCard" class="card hidden">
            <h2>Submit Inspection Request</h2>
            <label>Property Address</label>
            <input id="address" placeholder="e.g. 12 MG Road, Mumbai">
            <label>Property Type</label>
            <select id="propertyType">
                <option value="Residential">Residential</option>
                <option value="Commercial">Commercial</option>
                <option value="Industrial">Industrial</option>
                <option value="Land / Plot">Land / Plot</option>
            </select>
            <label>Contact Number</label>
            <input id="contactNumber" placeholder="e.g. 98765 43210">
            <label>Notes (optional)</label>
            <textarea id="notes" placeholder="Anything the reviewer should know before inspecting..."></textarea>
            <button class="primary" onclick="submitRequest()">Submit Request</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
                <h2 style="margin:0;">All Inspection Requests</h2>
                <div style="display:flex; align-items:center; gap:14px;">
                    <label class="checkbox-row" id="onlyMineWrap">
                        <input type="checkbox" id="onlyMine" onchange="loadRequests()">
                        Only show mine
                    </label>
                    <select id="statusFilter" onchange="loadRequests()" style="width:auto; padding:6px 10px; font-size:13px;">
                        <option value="">All statuses</option>
                        <option value="SUBMITTED">Submitted</option>
                        <option value="UNDER_REVIEW">Under Review</option>
                        <option value="APPROVED">Approved</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>
            </div>
            <table id="tbl"></table>
        </div>
    </main>
</div>

<script>
    let currentUser = null;

    function showTab(tab){
        document.getElementById('loginTab').classList.toggle('hidden', tab !== 'login');
        document.getElementById('registerTab').classList.toggle('hidden', tab !== 'register');
        document.getElementById('loginTabBtn').classList.toggle('active', tab === 'login');
        document.getElementById('registerTabBtn').classList.toggle('active', tab === 'register');
        document.getElementById('authMsg').innerHTML = '';
    }

    function showMsg(text, type){
        document.getElementById('authMsg').innerHTML = `<div class="msg ${type}">${text}</div>`;
    }

    async function register(){
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;
        const role = document.getElementById('regRole').value;
        const res = await fetch('/api/users/register', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password, role})
        });
        if(res.ok){
            showMsg('Registered! An admin needs to approve your account before you can log in.', 'ok');
            showTab('login');
        } else {
            showMsg('Registration failed \u2014 that username may already be taken.', 'error');
        }
    }

    async function login(){
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const res = await fetch('/api/users/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        if(!res.ok){ showMsg('Incorrect username or password.', 'error'); return; }
        const user = await res.json();
        if(!user.approved){ showMsg('Your account is registered but not yet approved by an admin.', 'error'); return; }

        currentUser = user;
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('appView').classList.remove('hidden');
        document.getElementById('whoami').textContent = user.username;
        document.getElementById('roleLabel').textContent = user.role.replace('_',' ');

        const isAdmin = user.role === 'ADMIN';
        const canSubmit = user.role === 'INSPECTOR' || user.role === 'PROPERTY_OWNER';

        document.getElementById('pendingCard').classList.toggle('hidden', !isAdmin);
        document.getElementById('usersCard').classList.toggle('hidden', !isAdmin);
        document.getElementById('submitCard').classList.toggle('hidden', !canSubmit);
        document.getElementById('statsRow').classList.toggle('hidden', !isAdmin);
        document.getElementById('onlyMineWrap').classList.toggle('hidden', !canSubmit);
        document.getElementById('onlyMineWrap').style.display = canSubmit ? 'flex' : 'none';

        if(isAdmin){ loadPending(); loadUsers(); }
        loadRequests();
    }

    function logout(){
        currentUser = null;
        document.getElementById('appView').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        showMsg('', '');
    }

    async function loadUsers(){
        const res = await fetch('/api/users');
        const data = await res.json();
        const tbl = document.getElementById('usersTbl');
        let rows = '<tr><th>Username</th><th>Role</th><th>Status</th></tr>';
        data.forEach(u => {
            rows += `<tr><td>${u.username}</td><td><span class="role-tag ${u.role}">${u.role.replace('_',' ')}</span></td>
      <td>${u.approved ? '<span class="badge APPROVED">Approved</span>' : '<span class="badge SUBMITTED">Pending</span>'}</td></tr>`;
        });
        tbl.innerHTML = rows;
    }

    async function loadPending(){
        const res = await fetch('/api/users/pending');
        const data = await res.json();
        const tbl = document.getElementById('pendingTbl');
        if(data.length === 0){
            tbl.innerHTML = '<tr><td class="empty">No pending approvals right now.</td></tr>';
            return;
        }
        let rows = '<tr><th>Username</th><th>Requested Role</th><th></th></tr>';
        data.forEach(u => {
            rows += `<tr><td>${u.username}</td><td>${u.role.replace('_',' ')}</td>
      <td><button class="icon-btn approve" onclick="approveUser(${u.id})">Approve</button></td></tr>`;
        });
        tbl.innerHTML = rows;
    }

    async function approveUser(id){
        await fetch(`/api/users/${id}/approve`, {method: 'PUT'});
        loadPending();
        loadUsers();
    }

    function updateStats(data){
        const counts = {SUBMITTED:0, UNDER_REVIEW:0, APPROVED:0, REJECTED:0};
        data.forEach(r => { if(counts[r.status] !== undefined) counts[r.status]++; });
        document.getElementById('statSubmitted').textContent = counts.SUBMITTED;
        document.getElementById('statUnderReview').textContent = counts.UNDER_REVIEW;
        document.getElementById('statApproved').textContent = counts.APPROVED;
        document.getElementById('statRejected').textContent = counts.REJECTED;
    }

    async function loadRequests(){
        const filter = document.getElementById('statusFilter').value;
        const url = filter ? `/api/inspections/status/${filter}` : '/api/inspections';
        const res = await fetch(url);
        let data = await res.json();

        if(currentUser && currentUser.role === 'ADMIN') updateStats(data);

        const onlyMineBox = document.getElementById('onlyMine');
        if(onlyMineBox && !onlyMineBox.closest('#onlyMineWrap').classList.contains('hidden') && onlyMineBox.checked){
            data = data.filter(r => r.inspectorName === currentUser.username);
        }

        const tbl = document.getElementById('tbl');
        const canReview = currentUser && (currentUser.role === 'REVIEWER' || currentUser.role === 'ADMIN');

        if(data.length === 0){
            tbl.innerHTML = '<tr><td class="empty">No inspection requests match this filter.</td></tr>';
            return;
        }

        let rows = `<tr><th>ID</th><th>Address</th><th>Type</th><th>Submitted By</th><th>Status</th><th>Remarks</th>${canReview ? '<th></th>' : ''}</tr>`;
        data.forEach(r => {
            let actions = '';
            if(canReview){
                if(r.status === 'SUBMITTED'){
                    actions = `<td><button class="icon-btn" onclick="act(${r.id},'start-review')">Start Review</button></td>`;
                } else if(r.status === 'UNDER_REVIEW'){
                    actions = `<td>
          <button class="icon-btn approve" onclick="act(${r.id},'approve')">Approve</button>
          <button class="icon-btn reject" onclick="act(${r.id},'reject')">Reject</button>
        </td>`;
                } else {
                    actions = '<td></td>';
                }
            }
            rows += `<tr>
      <td>${r.id}</td>
      <td>${r.propertyAddress}${r.contactNumber ? `<div class="remarks-note">${r.contactNumber}</div>` : ''}</td>
      <td>${r.propertyType || '\u2014'}</td>
      <td>${r.inspectorName}</td>
      <td><span class="badge ${r.status}">${r.status.replace('_',' ')}</span></td>
      <td>${r.reviewerRemarks ? r.reviewerRemarks : (r.notes ? `<span class="remarks-note">${r.notes}</span>` : '\u2014')}</td>
      ${actions}
    </tr>`;
        });
        tbl.innerHTML = rows;
    }

    async function act(id, action){
        let remarks = '';
        if(action === 'approve' || action === 'reject'){
            remarks = window.prompt(`Add a remark for this ${action === 'approve' ? 'approval' : 'rejection'} (optional):`, '') || '';
        }
        await fetch(`/api/inspections/${id}/${action}`, {
            method: 'PUT', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({remarks})
        });
        loadRequests();
    }

    async function submitRequest(){
        const address = document.getElementById('address').value;
        const propertyType = document.getElementById('propertyType').value;
        const contactNumber = document.getElementById('contactNumber').value;
        const notes = document.getElementById('notes').value;
        if(!address) return;
        await fetch('/api/inspections', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                propertyAddress: address,
                inspectorName: currentUser.username,
                propertyType, contactNumber, notes
            })
        });
        document.getElementById('address').value = '';
        document.getElementById('contactNumber').value = '';
        document.getElementById('notes').value = '';
        loadRequests();
    }
</script>
</body>
</html>
